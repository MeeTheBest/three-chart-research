services:
  - type: web
    name: three-chart-research
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: QWEN_MODEL
        value: kimi-k2.7-code
      - key: QWEN_MAX_OUTPUT_TOKENS
        value: "16000"
      - key: SOURCE_REPOSITORY_URL
        value: https://github.com/MeeTheBest/three-chart-research
